services:
  - type: web
    name: tea-store-backend
    runtime: node
    region: oregon
    repo: https://github.com/yourusername/teabackend  # Replace with actual repo
    branch: main
    buildCommand: npm install        # ✅ This was missing
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_CONNECTION_STRING
        value: <Set in Render dashboard>
      - key: JWT_SECRET
        value: <Set in Render dashboard>
      - key: JWT_EXPIRES_IN
        value: 90d
      - key: PORT
        value: 5000
    plan: free
